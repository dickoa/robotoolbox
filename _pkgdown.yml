url: https://dickoa.gitlab.io/robotoolbox/

template:
  package: unhcrtemplate
  bootstrap: 5

reference:
  - title: Package
    contents:
      - robotoolbox-package

  - title: Examples of KoboToolbox assets and data
    contents:
      - dummy_asset
      - dummy_data

  - title: robotoolbox settings
    contents:
      - kobo_setup
      - kobo_settings
      - kobo_token

  - title: Languages
    contents:
      - kobo_lang
      - kobo_lang_get
      - kobo_lang_set

  - title: KoboToolbox asset
    contents:
      - kobo_asset
      - kobo_asset_list
      - kobo_asset_version
      - kobo_asset_version_list
      - kobo_asset_file_list

  - title: KoboToolbox form
    contents:
      - kobo_form

  - title: KoboToolbox submissions and audit data
    contents:
      - kobo_data
      - kobo_submissions
      - kobo_audit
      - kobo_attachment_download

  - title: Cache management
    contents:
      - kobo_cache
      - kobo_cache_clear
      - kobo_cache_info
